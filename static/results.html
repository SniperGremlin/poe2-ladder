<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoE2 Survey Results</title>
<style>
  :root {
    --bg: #111111;
    --surface: #15171a;
    --surface2: #1a1d21;
    --border: #2c2c2c;
    --gold: #e0bc5a;
    --gold-mid: #c9a646;
    --gold-dim: #8a6f2e;
    --text: #d8d8d8;
    --text-dim: #8a8a8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; font-size: 14px; }
  .inner { max-width: 1600px; margin: 0 auto; padding: 0 24px; }

  header { position: relative; border-bottom: 1px solid rgba(201,166,70,0.35); overflow: hidden; }
  .banner-img { width: 100%; display: block; height: 180px; object-fit: cover; object-position: center center; }
  .banner-overlay {
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(0,0,0,0.10) 0%, rgba(0,0,0,0.45) 100%),
      linear-gradient(to right, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.0) 70%, rgba(0,0,0,0.55) 100%);
  }
  .banner-content {
    position: absolute; inset: 0; display: flex; align-items: flex-end;
    padding: 0 24px 14px; max-width: 1600px; margin: 0 auto; left: 0; right: 0;
  }
  header h1 { color: var(--gold); font-size: 24px; font-weight: 700; letter-spacing: 0.06em; text-shadow: 0 2px 10px rgba(0,0,0,1); }
  header .subtitle { color: var(--text-dim); font-size: 11px; text-shadow: 0 1px 6px rgba(0,0,0,1); }

  .site-nav { background: var(--surface); border-bottom: 1px solid var(--border); }
  .site-nav .inner { display: flex; gap: 4px; padding-top: 8px; padding-bottom: 8px; }
  .nav-link {
    padding: 6px 16px; border-radius: 4px; font-size: 13px;
    color: var(--text-dim); text-decoration: none;
    border: 1px solid transparent; transition: all 0.15s;
  }
  .nav-link:hover { border-color: var(--gold-dim); color: var(--text); }
  .nav-link.active { background: #1c160a; border-color: var(--gold-mid); color: var(--gold); }

  .controls { background: var(--surface); border-bottom: 1px solid var(--border); }
  .controls .inner { display: flex; gap: 4px; padding-top: 12px; padding-bottom: 12px; }
  .tab {
    padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px;
    background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim);
    transition: all 0.15s;
  }
  .tab:hover { border-color: var(--gold-dim); color: var(--text); }
  .tab.active { background: #1c160a; border-color: var(--gold-mid); color: var(--gold); }

  .stats-bar { background: var(--surface); border-bottom: 1px solid var(--border); }
  .stats-bar .inner { display: flex; flex-wrap: wrap; gap: 24px; padding-top: 10px; padding-bottom: 10px; }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
  .stat-value { font-size: 18px; color: var(--gold); font-weight: 600; }

  .chart-section { background: var(--surface); border-bottom: 1px solid var(--border); }
  .chart-section .inner { padding-top: 12px; padding-bottom: 14px; }
  canvas { display: block; cursor: default; }

  .no-data { text-align: center; padding: 72px 24px; color: var(--text-dim); }
  .no-data h2 { color: var(--gold); margin-bottom: 8px; }
  .survey-cta {
    display: inline-block; margin-top: 20px; padding: 10px 28px;
    border: 1px solid var(--gold-mid); color: var(--gold);
    background: #1c160a; border-radius: 6px; text-decoration: none;
    font-size: 14px; font-weight: 500; transition: all 0.15s;
  }
  .survey-cta:hover { background: #2a1f0d; }
</style>
</head>
<body>

<header>
  <img src="/banner.png" class="banner-img" alt="">
  <div class="banner-overlay"></div>
  <div class="banner-content">
    <div>
      <h1>Survey Results</h1>
      <div class="subtitle">Path of Exile 2 &mdash; Return of the Ancients</div>
    </div>
  </div>
</header>

<nav class="site-nav">
  <div class="inner">
    <a class="nav-link" href="/">Ladder</a>
    <a class="nav-link" href="/survey">Survey</a>
    <a class="nav-link active" href="/results">Results</a>
  </div>
</nav>

<div class="controls">
  <div class="inner" id="leagueTabs"></div>
</div>

<div class="stats-bar">
  <div class="inner">
    <div class="stat">
      <div class="stat-label">Total Responses</div>
      <div class="stat-value" id="statTotal">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">This League</div>
      <div class="stat-value" id="statLeague">—</div>
    </div>
  </div>
</div>

<div class="chart-section">
  <div class="inner">
    <canvas id="chart" height="0"></canvas>
  </div>
</div>

<div id="noData" class="no-data" style="display:none">
  <h2>No responses yet</h2>
  <p>Be the first to submit.</p>
  <a class="survey-cta" href="/survey">Take the Survey</a>
</div>

<script>
const BASE_ICON = 'https://pathofexile2.wiki.fextralife.com/file/Path-of-Exile-2/';
const CLASS_ICONS = {
  'Invoker':              BASE_ICON + 'invoker_monk_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Infernalist':          BASE_ICON + 'blood_mage_witch_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Witchhunter':          BASE_ICON + 'witchhunter_mercenary_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Deadeye':              BASE_ICON + 'deadeye_ranger_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Ritualist':            BASE_ICON + 'ritualist_portrait_path_of_exile2_wiki_guide115px.jpg',
  'Blood Mage':           BASE_ICON + 'infernalist_witch_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Pathfinder':           BASE_ICON + 'pathfinder_ranger_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Gemling Legionnaire':  BASE_ICON + 'gemling_legionnaire_mercenary_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Stormweaver':          BASE_ICON + 'stormweaver_sorceress_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Titan':                BASE_ICON + 'titan_warrior_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Warbringer':           BASE_ICON + 'warbringer_warrior_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Oracle':               BASE_ICON + 'oracle-ascendancy-poe-2-wiki-guide.jpg',
  'Shaman':               BASE_ICON + 'shaman-ascendancy-poe-2-wiki-guide.jpg',
  'Chronomancer':         BASE_ICON + 'chronomancer_sorceress_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Tactician':            BASE_ICON + 'the_tactician_portrait_path_of_exile2_wiki_guide116px.jpg',
  'Amazon':               BASE_ICON + 'amazon_portrait_path_of_exile2_wiki_guide116px.jpg',
  'Acolyte of Chayula':   BASE_ICON + 'acolyte_of_chayula_monk_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Smith of Kitava':      BASE_ICON + 'smith_of_kitava_guide_path_of_exile_2_wiki.jpg',
  'Disciple of Varashta': BASE_ICON + 'disciple-of-varashta-ascendancy-poe2-wiki-guide.png',
  'Martial Artist':       '/static/martial-artist.jpg',
  'Spirit Walker':        '/static/spirit-walker.jpg',
};

const CLASS_COLORS = {
  'Invoker':              '#4a7eb8',
  'Infernalist':          '#c04030',
  'Witchhunter':          '#9e7040',
  'Deadeye':              '#4a9040',
  'Ritualist':            '#b05080',
  'Blood Mage':           '#b83838',
  'Pathfinder':           '#4a9e6e',
  'Gemling Legionnaire':  '#b09030',
  'Stormweaver':          '#4060c0',
  'Titan':                '#c47820',
  'Warbringer':           '#a03030',
  'Oracle':               '#c4882a',
  'Shaman':               '#7a9e40',
  'Chronomancer':         '#4090b0',
  'Tactician':            '#7a8060',
  'Amazon':               '#4a8e8e',
  'Acolyte of Chayula':   '#8840b0',
  'Smith of Kitava':      '#c06030',
  'Disciple of Varashta': '#7c5cbf',
  'Martial Artist':       '#40a070',
  'Spirit Walker':        '#70a060',
};

const LEAGUE_TABS = ['All', 'Standard', 'Hardcore', 'Solo Self-Found', 'Hardcore SSF'];
const LEAGUE_LABELS = { 'Solo Self-Found': 'SSF', 'Hardcore SSF': 'HC SSF' };

const iconImages = {};
Object.entries(CLASS_ICONS).forEach(([cls, url]) => {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => { if (surveyData) render(); };
  img.src = url;
  iconImages[cls] = img;
});

let surveyData = null;
let totalResponses = 0;
let currentLeague = 'All';

async function init() {
  const saved = localStorage.getItem('poe2_survey_league');
  if (saved && LEAGUE_TABS.includes(saved)) currentLeague = saved;

  buildTabs();

  const res = await fetch('/api/survey/results');
  const data = await res.json();
  totalResponses = data.total;
  surveyData = data.by_league;

  document.getElementById('statTotal').textContent = totalResponses.toLocaleString();
  render();
}

function buildTabs() {
  const el = document.getElementById('leagueTabs');
  el.innerHTML = LEAGUE_TABS.map(l =>
    `<div class="tab ${l === currentLeague ? 'active' : ''}" onclick="selectLeague('${l}')">
      ${LEAGUE_LABELS[l] || l}
    </div>`
  ).join('');
}

function selectLeague(league) {
  currentLeague = league;
  buildTabs();
  render();
}

function render() {
  let counts = {};
  if (currentLeague === 'All') {
    Object.values(surveyData || {}).forEach(league => {
      Object.entries(league).forEach(([asc, n]) => {
        counts[asc] = (counts[asc] || 0) + n;
      });
    });
  } else {
    counts = (surveyData || {})[currentLeague] || {};
  }

  const leagueTotal = Object.values(counts).reduce((s, n) => s + n, 0);
  document.getElementById('statLeague').textContent = leagueTotal.toLocaleString();

  if (!leagueTotal) {
    document.getElementById('noData').style.display = 'block';
    document.getElementById('chart').height = 0;
    return;
  }

  document.getElementById('noData').style.display = 'none';
  drawChart(counts, leagueTotal);
}

function drawChart(counts, total) {
  const canvas = document.getElementById('chart');
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (!sorted.length) { canvas.height = 0; return; }

  const ICON = 26, ROW = 34, PAD = 8, LABEL = 180, GAP = 6;
  const maxCount = sorted[0][1];
  const W = canvas.parentElement.clientWidth - 48;
  canvas.width = W;
  canvas.height = sorted.length * ROW + PAD;

  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, canvas.height);
  const barW = W - LABEL - 90;

  sorted.forEach(([cls, n], i) => {
    const y = PAD / 2 + i * ROW;
    const pct = ((n / total) * 100).toFixed(1);
    const fillW = Math.round((n / maxCount) * barW);
    const baseColor = CLASS_COLORS[cls] || '#7a7a7a';

    const img = iconImages[cls];
    if (img && img.complete && img.naturalWidth) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(ICON / 2 + 2, y + ROW / 2, ICON / 2, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(img, 2, y + (ROW - ICON) / 2, ICON, ICON);
      ctx.restore();
    }

    ctx.fillStyle = '#1a1d21';
    ctx.fillRect(LABEL, y + 3, barW, ROW - GAP);

    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    [0.25, 0.5, 0.75, 1.0].forEach(frac => {
      const gx = LABEL + Math.round(frac * barW);
      ctx.beginPath(); ctx.moveTo(gx, y + 3); ctx.lineTo(gx, y + ROW - GAP); ctx.stroke();
    });

    if (fillW > 0) {
      const grad = ctx.createLinearGradient(LABEL, 0, LABEL + fillW, 0);
      grad.addColorStop(0, baseColor + '99');
      grad.addColorStop(1, baseColor);
      ctx.fillStyle = grad;
      ctx.fillRect(LABEL, y + 3, fillW, ROW - GAP);
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(LABEL, y + 3, fillW, 2);
    }

    ctx.fillStyle = i === 0 ? '#e0e0e0' : '#c0c0c0';
    ctx.font = `${i === 0 ? 600 : 400} 12px "Segoe UI", sans-serif`;
    ctx.textAlign = 'right';
    ctx.fillText(cls, LABEL - 8, y + ROW - GAP - 5);

    ctx.fillStyle = i === 0 ? baseColor : '#6a6a6a';
    ctx.font = `${i === 0 ? 600 : 400} 11px "Segoe UI", sans-serif`;
    ctx.textAlign = 'left';
    ctx.fillText(`${n}  (${pct}%)`, LABEL + fillW + 8, y + ROW - GAP - 5);
  });
}

init();
</script>
</body>
</html>
