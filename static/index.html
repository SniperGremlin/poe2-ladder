<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoE2 Ladder Viewer</title>
<style>
  :root {
    --bg: #111111;
    --surface: #15171a;
    --surface2: #1a1d21;
    --border: #2c2c2c;
    --gold: #e0bc5a;
    --gold-mid: #c9a646;
    --gold-dim: #8a6f2e;
    --gold-dark: #b08d2f;
    --text: #d8d8d8;
    --text-dim: #8a8a8a;
    --dead: #8b2020;
    --retired: #4a4a6a;
    --alive: #2a5c2a;
    --red: #c0392b;
    --green: #27ae60;
    --blue: #2980b9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; font-size: 14px; }

  /* full-bleed sections get inner wrappers capped at max-width */
  .inner {
    max-width: 1600px;
    margin: 0 auto;
    padding: 0 24px;
  }

  header {
    position: relative;
    border-bottom: 1px solid rgba(201,166,70,0.35);
    overflow: hidden;
  }
  .banner-img {
    width: 100%; display: block;
    height: 180px;
    object-fit: cover; object-position: center center;
  }
  .banner-overlay {
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(0,0,0,0.10) 0%, rgba(0,0,0,0.45) 100%),
      linear-gradient(to right,  rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.0) 70%, rgba(0,0,0,0.55) 100%);
  }
  .banner-content {
    position: absolute; inset: 0; display: flex; align-items: flex-end;
    padding: 0 24px 14px;
    max-width: 1600px; margin: 0 auto; left: 0; right: 0;
    gap: 16px;
  }
  header h1 { color: var(--gold); font-size: 24px; font-weight: 700; letter-spacing: 0.06em; text-shadow: 0 2px 10px rgba(0,0,0,1); }
  header .subtitle { color: var(--text-dim); font-size: 11px; text-shadow: 0 1px 6px rgba(0,0,0,1); }
  .fetched-at { margin-left: auto; color: var(--text-dim); font-size: 11px; text-align: right; text-shadow: 0 1px 6px rgba(0,0,0,1); }

  .controls {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0;
  }
  .controls .inner {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    padding-top: 12px; padding-bottom: 12px;
  }
  .league-tabs { display: flex; gap: 4px; }
  .tab {
    padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px;
    background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim);
    transition: all 0.15s;
  }
  .tab:hover { border-color: var(--gold-dim); color: var(--text); }
  .tab.active { background: #1c160a; border-color: var(--gold-mid); color: var(--gold); }

  .filter-group { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  select, input[type=text], input[type=number] {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    padding: 5px 10px; border-radius: 4px; font-size: 13px; outline: none;
  }
  select:focus, input:focus { border-color: var(--gold-dim); }
  label { color: var(--text-dim); font-size: 12px; }

  .status-filters { display: flex; gap: 8px; }
  .status-btn {
    padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
    border: 1px solid var(--border); background: var(--surface2); color: var(--text-dim);
    transition: all 0.15s;
  }
  .status-btn.on-dead   { border-color: var(--dead);    color: #e05555; background: #1a0808; }
  .status-btn.on-alive  { border-color: var(--green);   color: #55c555; background: #081a08; }
  .status-btn.on-retired{ border-color: #6666aa;        color: #9999cc; background: #0a0a1a; }

  .stats-bar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0;
  }
  .stats-bar .inner {
    display: flex; flex-wrap: wrap; gap: 24px;
    padding-top: 10px; padding-bottom: 10px;
  }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
  .stat-value { font-size: 18px; color: var(--gold); font-weight: 600; }
  /* ── class filter section ── */
  .class-filter-section {
    background: var(--surface); border-bottom: 1px solid var(--border); padding: 0;
  }
  .class-filter-section .inner {
    display: flex; flex-direction: column; gap: 10px;
    padding-top: 10px; padding-bottom: 12px;
  }
  .base-class-row {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
  }
  .base-class-label {
    font-size: 10px; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 0.08em; margin-right: 2px; white-space: nowrap;
  }
  .base-btn {
    padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 12px;
    border: 1px solid rgba(255,255,255,0.12); background: var(--surface2); color: var(--text-dim);
    transition: all 0.18s; font-weight: 600; letter-spacing: 0.04em; white-space: nowrap;
  }
  .base-btn:hover { border-color: var(--gold-dim); color: var(--text); }
  .base-btn.active { background: #1c160a; border-color: var(--gold-mid); color: var(--gold); box-shadow: 0 0 0 1px var(--gold-dim); }
  .base-btn.partial { border-color: var(--gold-dim); color: var(--gold-dim); background: #181410; }
  .class-pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pill { transition: opacity 0.2s, border-color 0.2s, background 0.2s, color 0.2s; }
  .pill.dimmed { opacity: 0.28; }
  .pill {
    padding: 4px 10px 4px 4px; border-radius: 16px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface2); color: var(--text-dim);
    transition: all 0.15s; display: flex; align-items: center; gap: 6px;
  }
  .pill:hover { border-color: var(--gold-dim); }
  .pill.active { border-color: var(--gold-mid); color: var(--gold); background: #1c160a; }
  .pill img {
    width: 30px; height: 30px; border-radius: 50%; object-fit: cover; object-position: top;
    border: 1px solid var(--border); flex-shrink: 0;
  }
  .pill.active img { border-color: var(--gold-dim); }
  .class-icon { width: 20px; height: 20px; border-radius: 3px; object-fit: cover; object-position: top; vertical-align: middle; margin-right: 4px; }

  .table-wrap { overflow-x: auto; padding: 0; }
  #content .inner { padding-bottom: 24px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  thead th {
    background: var(--surface); color: var(--text-dim); font-weight: 500;
    padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 1; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.06em; cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th:hover { color: var(--gold); }
  thead th.sorted { color: var(--gold); }
  thead th .sort-arrow { opacity: 0.5; margin-left: 4px; }
  thead th.sorted .sort-arrow { opacity: 1; }

  tbody tr { border-bottom: 1px solid #1a1a1a; transition: background 0.1s; }
  tbody tr:hover { background: var(--surface2); }
  tbody td { padding: 7px 10px; }

  .rank { color: var(--text-dim); font-size: 12px; min-width: 44px; }
  .rank-top { color: var(--gold); font-weight: 600; }
  .account { color: #7ab3d4; font-size: 12px; }
  .char-name { font-weight: 500; }
  .status-tag {
    display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 3px;
    margin-left: 6px; vertical-align: middle;
  }
  .tag-dead    { background: #3a0a0a; color: #e05555; border: 1px solid var(--dead); }
  .tag-retired { background: #0a0a1a; color: #9999cc; border: 1px solid #444; }
  .class-cell { color: #b8a070; font-size: 12px; }
  .level { text-align: right; font-variant-numeric: tabular-nums; }
  .level-100 { color: var(--gold); font-weight: 600; }
  .xp { text-align: right; color: var(--text-dim); font-size: 12px; font-variant-numeric: tabular-nums; }

  .no-data {
    text-align: center; padding: 60px 24px; color: var(--text-dim);
  }
  .no-data h2 { color: var(--gold); margin-bottom: 8px; }

  .top-n-wrap { display: flex; align-items: center; gap: 6px; }

  .chart-section {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0;
  }
  .chart-section .inner { padding-top: 12px; padding-bottom: 14px; }
  .chart-section canvas { display: block; cursor: pointer; }

  .site-nav { background: var(--surface); border-bottom: 1px solid var(--border); }
  .site-nav .inner { display: flex; gap: 4px; padding-top: 8px; padding-bottom: 8px; }
  .nav-link {
    padding: 6px 16px; border-radius: 4px; font-size: 13px;
    color: var(--text-dim); text-decoration: none;
    border: 1px solid transparent; transition: all 0.15s;
  }
  .nav-link:hover { border-color: var(--gold-dim); color: var(--text); }
  .nav-link.active { background: #1c160a; border-color: var(--gold-mid); color: var(--gold); }

  @media (max-width: 700px) {
    .controls { flex-direction: column; align-items: flex-start; }
    .filter-group { margin-left: 0; }
    .class-pills { margin-left: 0; }
  }
</style>
</head>
<body>

<header>
  <img src="banner.png" class="banner-img" alt="">
  <div class="banner-overlay"></div>
  <div class="banner-content">
    <div>
      <h1>PoE2 Ladder Viewer</h1>
      <div class="subtitle">Path of Exile 2 &mdash; Ascendancy Filter</div>
    </div>
    <div class="fetched-at" id="fetchedAt">—</div>
  </div>
</header>

<nav class="site-nav">
  <div class="inner">
    <a class="nav-link active" href="/">Ladder</a>
    <a class="nav-link" href="/survey">Survey</a>
    <a class="nav-link" href="/results">Results</a>
  </div>
</nav>

<div class="controls">
  <div class="inner">
    <div class="league-tabs" id="leagueTabs">
      <div class="tab active" data-league="">Loading...</div>
    </div>

    <div style="margin-left:8px;">
      <button id="scrapeBtn" onclick="refreshLeague()" title=" " style="
        padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 13px;
        background: transparent; border: 1px solid transparent; color: var(--text-dim);
        transition: all 0.15s; font-family: inherit;
      " onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-dim)'">
        S
      </button>
    </div>

    <div class="filter-group">
      <label>Search</label>
      <input type="text" id="searchInput" placeholder="Account, character or class…" style="width:200px">
    </div>

    <div class="filter-group">
      <label>Status</label>
      <div class="status-filters" id="statusFilters">
        <div class="status-btn" data-status="alive" onclick="toggleStatus('alive')">Alive</div>
        <div class="status-btn" data-status="dead"  onclick="toggleStatus('dead')">Dead</div>
        <div class="status-btn" data-status="retired" onclick="toggleStatus('retired')">Retired</div>
      </div>
    </div>

    <div class="filter-group top-n-wrap">
      <label>Top</label>
      <input type="number" id="topN" value="" min="1" max="1000" placeholder="all" style="width:64px">
    </div>
  </div>
</div>

<div class="stats-bar" id="statsBar">
  <div class="inner">
    <div class="stat"><div class="stat-label">Showing</div><div class="stat-value" id="statCount">—</div></div>
    <div class="stat"><div class="stat-label">Avg Level</div><div class="stat-value" id="statAvgLevel">—</div></div>
    <div class="stat"><div class="stat-label">Max Level</div><div class="stat-value" id="statMaxLevel">—</div></div>
    <div class="stat"><div class="stat-label">Deaths</div><div class="stat-value" id="statDeaths">—</div></div>
    <div class="stat"><div class="stat-label">Exiles Served</div><div class="stat-value" id="statExiles" style="color:var(--gold-mid)">—</div></div>
  </div>
</div>

<div class="class-filter-section">
  <div class="inner">
    <div class="base-class-row">
      <span class="base-class-label">Class</span>
      <div class="base-btn" id="btnAll" onclick="clearFilters()">All</div>
      <div id="baseClassButtons"></div>
    </div>
    <div class="class-pills" id="classPills"></div>
  </div>
</div>

<div class="chart-section" id="chartSection">
  <div class="inner">
    <canvas id="chart" height="0"></canvas>
  </div>
</div>

<div id="content">
  <div class="no-data"><h2>Loading…</h2></div>
</div>

<script>
const BASE = 'https://pathofexile2.wiki.fextralife.com/file/Path-of-Exile-2/';
const CLASS_ICONS = {
  'Invoker':              BASE + 'invoker_monk_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Infernalist':          BASE + 'blood_mage_witch_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Witchhunter':          BASE + 'witchhunter_mercenary_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Deadeye':              BASE + 'deadeye_ranger_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Ritualist':            BASE + 'ritualist_portrait_path_of_exile2_wiki_guide115px.jpg',
  'Lich':                 BASE + 'lich_guide_path_of_exile_2_wiki.jpg',
  'Abyssal Lich':         BASE + 'lich_guide_path_of_exile_2_wiki.jpg',
  'Blood Mage':           BASE + 'infernalist_witch_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Pathfinder':           BASE + 'pathfinder_ranger_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Gemling Legionnaire':  BASE + 'gemling_legionnaire_mercenary_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Stormweaver':          BASE + 'stormweaver_sorceress_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Titan':                BASE + 'titan_warrior_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Warbringer':           BASE + 'warbringer_warrior_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Oracle':               BASE + 'oracle-ascendancy-poe-2-wiki-guide.jpg',
  'Shaman':               BASE + 'shaman-ascendancy-poe-2-wiki-guide.jpg',
  'Chronomancer':         BASE + 'chronomancer_sorceress_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Tactician':            BASE + 'the_tactician_portrait_path_of_exile2_wiki_guide116px.jpg',
  'Amazon':               BASE + 'amazon_portrait_path_of_exile2_wiki_guide116px.jpg',
  'Acolyte of Chayula':   BASE + 'acolyte_of_chayula_monk_ascendancy_class_poe2_wiki_guide_216px.jpg',
  'Smith of Kitava':      BASE + 'smith_of_kitava_guide_path_of_exile_2_wiki.jpg',
  'Disciple of Varashta': BASE + 'disciple-of-varashta-ascendancy-poe2-wiki-guide.png',
};

// per-class identity colours (muted but distinct)
// base class groups
const BASE_CLASSES = {
  'Warrior':   ['Titan', 'Warbringer', 'Smith of Kitava'],
  'Ranger':    ['Deadeye', 'Pathfinder'],
  'Witch':     ['Infernalist', 'Blood Mage', 'Lich', 'Abyssal Lich'],
  'Monk':      ['Invoker', 'Acolyte of Chayula', 'Martial Artist'],
  'Mercenary': ['Witchhunter', 'Gemling Legionnaire', 'Tactician'],
  'Sorceress': ['Stormweaver', 'Chronomancer', 'Disciple of Varashta'],
  'Druid':     ['Shaman', 'Oracle'],
  'Huntress':  ['Amazon', 'Ritualist', 'Spirit Walker'],
};

// base class -> ascendancies (for search)
const CLASS_BASE = {
  'Titan':               'Warrior',
  'Warbringer':          'Warrior',
  'Smith of Kitava':     'Warrior',
  'Deadeye':             'Ranger',
  'Pathfinder':          'Ranger',
  'Infernalist':         'Witch',
  'Blood Mage':          'Witch',
  'Lich':                'Witch',
  'Abyssal Lich':        'Witch',
  'Invoker':             'Monk',
  'Acolyte of Chayula':  'Monk',
  'Witchhunter':         'Mercenary',
  'Gemling Legionnaire': 'Mercenary',
  'Tactician':           'Mercenary',
  'Stormweaver':         'Sorceress',
  'Chronomancer':        'Sorceress',
  'Disciple of Varashta':'Sorceress',
  'Shaman':              'Druid',
  'Oracle':              'Druid',
  'Amazon':              'Huntress',
  'Ritualist':           'Huntress',
  'Martial Artist':      'Monk',
  'Spirit Walker':       'Huntress',
};

const CLASS_COLORS = {
  'Invoker':              '#4a7eb8',
  'Infernalist':          '#c04030',
  'Witchhunter':          '#9e7040',
  'Deadeye':              '#4a9040',
  'Ritualist':            '#b05080',
  'Lich':                 '#5855a0',
  'Abyssal Lich':         '#7040a0',
  'Blood Mage':           '#b83838',
  'Pathfinder':           '#4a9e6e',
  'Gemling Legionnaire':  '#b09030',
  'Stormweaver':          '#4060c0',
  'Titan':                '#c47820',
  'Warbringer':           '#a03030',
  'Oracle':               '#c4882a',
  'Shaman':               '#7a9e40',
  'Chronomancer':         '#4090b0',
  'Tactician':            '#7a8060',
  'Amazon':               '#4a8e8e',
  'Acolyte of Chayula':   '#8840b0',
  'Smith of Kitava':      '#c06030',
  'Disciple of Varashta': '#7c5cbf',
  'Martial Artist':       '#40a070',
  'Spirit Walker':        '#70a060',
};

// preload all icons so canvas can draw them; redraw chart when each loads
const iconImages = {};
Object.entries(CLASS_ICONS).forEach(([cls, url]) => {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => { if (allData.length) render(); };
  img.src = url;
  iconImages[cls] = img;
});

let allData = [];
let classRankMap = {};
let currentLeague = '';
let sortCol = 'rank';
let sortDir = 1;
let activeClasses = new Set();
let activeStatuses = new Set(['alive', 'dead', 'retired']);
let leagueList = [];

// ── admin (localhost only) ─────────────────────────────────────────────────────

async function refreshLeague() {
  if (!currentLeague) return;
  const btn = document.getElementById('scrapeBtn');
  btn.textContent = '…';
  btn.disabled = true;
  try {
    await fetch(`/api/refresh/${currentLeague}`, { method: 'POST' });
    btn.textContent = '⟳';
    setTimeout(async () => {
      await selectLeague(currentLeague);
      btn.textContent = 'S';
      btn.disabled = false;
    }, 15000);
  } catch (e) {
    btn.textContent = 'S';
    btn.disabled = false;
  }
}

// ── boot ──────────────────────────────────────────────────────────────────────
async function init() {
  // hit counter — fire and forget
  fetch('https://api.counterapi.dev/v1/snipergremlin-poe2-ladder/visits/up')
    .then(r => r.json())
    .then(d => {
      document.getElementById('statExiles').textContent = (d.count || 0).toLocaleString();
    })
    .catch(() => {}); // silently fail if API is down

  const res = await fetch('data/leagues.json');
  leagueList = await res.json();
  renderTabs();
  if (leagueList.length) selectLeague(leagueList[0].id);
}

function renderTabs() {
  const el = document.getElementById('leagueTabs');
  if (!leagueList.length) {
    el.innerHTML = '<div class="tab active">No data yet — run scraper.py</div>';
    return;
  }
  el.innerHTML = leagueList.map(l =>
    `<div class="tab ${l.id === currentLeague ? 'active' : ''}"
          data-league="${l.id}" onclick="selectLeague('${l.id}')">${l.name}</div>`
  ).join('');
}

async function selectLeague(id) {
  currentLeague = id;
  renderTabs();
  activeClasses.clear();
  document.getElementById('fetchedAt').textContent = 'Loading…';

  const res = await fetch(`data/ladder_${id}.json`);
  if (!res.ok) {
    document.getElementById('content').innerHTML =
      '<div class="no-data"><h2>No data</h2><p>Run: <code>python scraper.py</code></p></div>';
    return;
  }
  const json = await res.json();
  allData = json.entries;

  // build per-class rank lookup
  classRankMap = {};
  const byClass = {};
  allData.forEach(e => { if (!byClass[e.class]) byClass[e.class] = []; byClass[e.class].push(e); });
  Object.values(byClass).forEach(group => {
    group.sort((a, b) => a.rank - b.rank);
    group.forEach((e, i) => { classRankMap[e.character] = i + 1; });
  });

  const d = new Date(json.fetched_at);
  document.getElementById('fetchedAt').innerHTML =
    `Last fetched<br>${d.toLocaleString()}`;

  buildClassPills();
  buildBaseClassButtons();
  render();
}

// ── class pills ───────────────────────────────────────────────────────────────
function buildClassPills() {
  const counts = {};
  allData.forEach(e => { counts[e.class] = (counts[e.class] || 0) + 1; });
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

  const el = document.getElementById('classPills');
  const anyActive = activeClasses.size > 0;
  el.innerHTML = sorted.map(([cls, n]) => {
    const isActive = activeClasses.has(cls);
    const isDimmed = anyActive && !isActive;
    const icon = CLASS_ICONS[cls] ? `<img src="${CLASS_ICONS[cls]}" alt="">` : '';
    return `<div class="pill ${isActive ? 'active' : ''} ${isDimmed ? 'dimmed' : ''}"
          onclick="toggleClass('${cls}')">${icon}${cls} <span style="opacity:.6">${n}</span></div>`;
  }).join('');
}

function toggleClass(cls) {
  if (activeClasses.has(cls)) activeClasses.delete(cls);
  else activeClasses.add(cls);
  buildClassPills();
  buildBaseClassButtons();
  render();
}

function toggleBaseClass(base) {
  const ascendancies = BASE_CLASSES[base];
  const allActive = ascendancies.every(a => activeClasses.has(a));
  if (allActive) {
    ascendancies.forEach(a => activeClasses.delete(a));
  } else {
    ascendancies.forEach(a => activeClasses.add(a));
  }
  buildClassPills();
  buildBaseClassButtons();
  render();
}

function clearFilters() {
  activeClasses.clear();
  buildClassPills();
  buildBaseClassButtons();
  render();
}

function buildBaseClassButtons() {
  // "All" button — active when nothing is filtered
  const btnAll = document.getElementById('btnAll');
  btnAll.className = 'base-btn' + (activeClasses.size === 0 ? ' active' : '');

  const container = document.getElementById('baseClassButtons');
  container.style.display = 'contents';
  container.innerHTML = Object.entries(BASE_CLASSES).map(([base, ascendancies]) => {
    const allActive  = ascendancies.every(a => activeClasses.has(a));
    const someActive = ascendancies.some(a => activeClasses.has(a));
    const cls = allActive ? 'active' : someActive ? 'partial' : '';
    return `<div class="base-btn ${cls}" onclick="toggleBaseClass('${base}')">${base}</div>`;
  }).join('');
}

// ── status filters ────────────────────────────────────────────────────────────
function toggleStatus(s) {
  if (activeStatuses.has(s)) activeStatuses.delete(s);
  else activeStatuses.add(s);

  document.querySelectorAll('.status-btn').forEach(btn => {
    const st = btn.dataset.status;
    btn.className = 'status-btn' + (activeStatuses.has(st) ? ` on-${st}` : '');
  });
  render();
}

// ── sort ──────────────────────────────────────────────────────────────────────
function setSort(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = 1; }
  render();
}

// ── render ────────────────────────────────────────────────────────────────────
function filtered() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const topN = parseInt(document.getElementById('topN').value) || Infinity;

  return allData.filter(e => {
    if (activeClasses.size && !activeClasses.has(e.class)) return false;
    if (!activeStatuses.has(e.dead ? 'dead' : e.retired ? 'retired' : 'alive')) return false;
    if (search) {
      const base = (CLASS_BASE[e.class] || '').toLowerCase();
      const cls  = e.class.toLowerCase();
      if (!e.account.toLowerCase().includes(search) &&
          !e.character.toLowerCase().includes(search) &&
          !cls.includes(search) &&
          !base.includes(search)) return false;
    }
    if (e.rank > topN) return false;
    return true;
  });
}

function render() {
  let rows = filtered();

  // sort
  rows.sort((a, b) => {
    let av = a[sortCol], bv = b[sortCol];
    if (typeof av === 'string') return av.localeCompare(bv) * sortDir;
    return (av - bv) * sortDir;
  });

  updateStats(rows);
  drawChart(rows);

  const cols = [
    { key: 'rank',       label: 'Overall Rank' },
    { key: 'classRank',  label: 'Ascendancy Rank' },
    { key: 'account',    label: 'Account' },
    { key: 'character',  label: 'Character' },
    { key: 'class',      label: 'Class' },
    { key: 'level',      label: 'Level' },
    { key: 'experience', label: 'Experience' },
  ];

  const thead = cols.map(c => {
    const active = sortCol === c.key;
    const arrow = active ? (sortDir === 1 ? '▲' : '▼') : '▲';
    return `<th class="${active ? 'sorted' : ''}" onclick="setSort('${c.key}')">
      ${c.label}<span class="sort-arrow">${arrow}</span></th>`;
  }).join('');

  const tbody = rows.map(e => {
    const statusTag = e.dead
      ? '<span class="status-tag tag-dead">Dead</span>'
      : e.retired ? '<span class="status-tag tag-retired">Retired</span>' : '';
    const rankClass = e.rank <= 10 ? 'rank rank-top' : 'rank';
    const lvlClass = e.level === 100 ? 'level level-100' : 'level';
    return `<tr>
      <td class="${rankClass}">#${e.rank}</td>
      <td class="rank" style="color:var(--text-dim);font-size:12px">#${classRankMap[e.character] || '—'}</td>
      <td class="account">${esc(e.account)}</td>
      <td class="char-name">${esc(e.character)}${statusTag}</td>
      <td class="class-cell">${CLASS_ICONS[e.class] ? `<img class="class-icon" src="${CLASS_ICONS[e.class]}" alt="">` : ''}${esc(e.class)}</td>
      <td class="${lvlClass}">${e.level}</td>
      <td class="xp">${e.experience.toLocaleString()}</td>
    </tr>`;
  }).join('');

  document.getElementById('content').innerHTML =
    rows.length
      ? `<div class="inner"><div class="table-wrap"><table><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table></div></div>`
      : '<div class="no-data"><h2>No results</h2><p>Try adjusting your filters.</p></div>';
}

function updateStats(rows) {
  document.getElementById('statCount').textContent = rows.length;
  if (!rows.length) {
    document.getElementById('statAvgLevel').textContent = '—';
    document.getElementById('statMaxLevel').textContent = '—';
    document.getElementById('statDeaths').textContent = '—';
    return;
  }
  const avg = (rows.reduce((s, e) => s + e.level, 0) / rows.length).toFixed(1);
  const max = Math.max(...rows.map(e => e.level));
  const deaths = rows.filter(e => e.dead).length;
  document.getElementById('statAvgLevel').textContent = avg;
  document.getElementById('statMaxLevel').textContent = max;
  document.getElementById('statDeaths').textContent = deaths;
}


function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('topN').addEventListener('input', render);

// ── chart ─────────────────────────────────────────────────────────────────────
function drawChart(rows) {
  const canvas = document.getElementById('chart');
  const counts = {};
  rows.forEach(e => { counts[e.class] = (counts[e.class] || 0) + 1; });
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

  if (!sorted.length) { canvas.height = 0; return; }

  const ICON = 26, ROW = 34, PAD = 8, LABEL = 180, GAP = 6;
  const total = rows.length;
  const maxCount = sorted[0][1];
  const W = canvas.parentElement.clientWidth - 48;
  canvas.width  = W;
  canvas.height = sorted.length * ROW + PAD;

  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, canvas.height);

  const barW = W - LABEL - 80;

  sorted.forEach(([cls, n], i) => {
    const y = PAD / 2 + i * ROW;
    const isActive = activeClasses.has(cls);
    const pct = ((n / total) * 100).toFixed(1);
    const fillW = Math.round((n / maxCount) * barW);

    // icon (circular clip)
    const img = iconImages[cls];
    if (img && img.complete && img.naturalWidth) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(ICON / 2 + 2, y + ROW / 2, ICON / 2, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(img, 2, y + (ROW - ICON) / 2, ICON, ICON);
      ctx.restore();
    }

    // determine dimming: if any class is selected, non-selected bars go dim
    const anyActive = activeClasses.size > 0;
    const dim = anyActive && !isActive;
    const baseColor = CLASS_COLORS[cls] || '#7a7a7a';

    // bar background
    ctx.fillStyle = '#1a1d21';
    ctx.fillRect(LABEL, y + 3, barW, ROW - GAP);

    // subtle grid lines at 25% intervals
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    [0.25, 0.5, 0.75, 1.0].forEach(frac => {
      const gx = LABEL + Math.round(frac * barW);
      ctx.beginPath(); ctx.moveTo(gx, y + 3); ctx.lineTo(gx, y + ROW - GAP); ctx.stroke();
    });

    // bar fill — class colour, dimmed if filtered out
    if (fillW > 0) {
      ctx.globalAlpha = dim ? 0.25 : 1.0;
      const grad = ctx.createLinearGradient(LABEL, 0, LABEL + fillW, 0);
      grad.addColorStop(0, baseColor + '99'); // slightly transparent start
      grad.addColorStop(1, baseColor);
      ctx.fillStyle = grad;
      ctx.fillRect(LABEL, y + 3, fillW, ROW - GAP);

      // subtle top highlight line for active
      if (!dim) {
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(LABEL, y + 3, fillW, 2);
      }
      ctx.globalAlpha = 1.0;
    }

    // class label
    ctx.fillStyle = dim ? '#4a4a4a' : (isActive ? '#e0e0e0' : '#c0c0c0');
    ctx.font = `${isActive ? 600 : 400} 12px "Segoe UI", sans-serif`;
    ctx.textAlign = 'right';
    ctx.fillText(cls, LABEL - 8, y + ROW - GAP - 5);

    // count + pct — use class colour when active
    ctx.fillStyle = dim ? '#3a3a3a' : (isActive ? baseColor : '#6a6a6a');
    ctx.font = `${isActive ? 600 : 400} 11px "Segoe UI", sans-serif`;
    ctx.textAlign = 'left';
    ctx.fillText(`${n}  (${pct}%)`, LABEL + fillW + 8, y + ROW - GAP - 5);
  });

  // click to filter
  canvas.onclick = function(e) {
    const rect = canvas.getBoundingClientRect();
    const my = e.clientY - rect.top - PAD / 2;
    const idx = Math.floor(my / ROW);
    if (idx >= 0 && idx < sorted.length) {
      toggleClass(sorted[idx][0]);
    }
  };
}

init();
</script>
</body>
</html>
